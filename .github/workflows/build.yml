name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Unit tests
        run: make test
      - name: Build exe
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: find_mymouse_byshake
          path: build/find_mymouse_byshake.exe
          if-no-files-found: error

  # Runs the real exe and the install / uninstall scripts on Windows.
  windows-smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: find_mymouse_byshake
          path: artifact
      - name: Install, verify, uninstall (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:FMMBS_FROM = (Resolve-Path artifact\find_mymouse_byshake.exe).Path
          .\install.ps1
          Start-Sleep -Seconds 3
          $p = Get-Process -Name find_mymouse_byshake -ErrorAction SilentlyContinue
          if (-not $p) { throw 'app is not running after install' }
          $cfg = Get-ItemProperty HKCU:\Software\find_mymouse_byshake
          if ($cfg.Welcomed -ne 1) { throw 'app did not finish initialising' }
          $run = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run
          if (-not $run.find_mymouse_byshake) { throw 'autostart entry missing' }
          # upgrade path: install again while the app is running
          $oldPid = $p.Id
          .\install.ps1
          Start-Sleep -Seconds 3
          $p2 = @(Get-Process -Name find_mymouse_byshake -ErrorAction SilentlyContinue)
          if ($p2.Count -ne 1) { throw "expected 1 running instance after upgrade, got $($p2.Count)" }
          if ($p2[0].Id -eq $oldPid) { throw 'old instance was not replaced' }
          .\uninstall.ps1
          Start-Sleep -Seconds 1
          if (Get-Process -Name find_mymouse_byshake -ErrorAction SilentlyContinue) { throw 'still running after uninstall' }
          if (Test-Path "$env:LOCALAPPDATA\find_mymouse_byshake") { throw 'install dir left behind' }
          if (Test-Path HKCU:\Software\find_mymouse_byshake) { throw 'settings left behind' }
          Write-Host 'smoke test passed'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: find_mymouse_byshake
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" find_mymouse_byshake.exe
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
